server {
    host 127.0.0.1
    port 8080
    root www
    index index.html
    max_body_size 1048576

    route / {
        methods GET POST DELETE
        root www
        index index.html
        directory_listing off
    }

    route /assets {
    methods GET
    root assets
    index hello.txt
    directory_listing off
    }

    route /uploads {
    methods GET POST DELETE
    root uploads
    index index.html
    directory_listing on
    }

    route /old-page {
    methods GET
    root www
    redirect /about.html
    directory_listing off
    }

    route /cgi {
    methods GET POST
    root cgi
    index hello.py
    cgi .py python3
    directory_listing off
    }
}