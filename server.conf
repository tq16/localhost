server {
    host 127.0.0.1
    server_name main.local www.main.local
    port 8080
    port 8081
    root www
    index index.html
    max_body_size 1048576

    route / {
        methods GET POST DELETE
        root www
        index index.html
        directory_listing off
    }

    route /assets {
    methods GET
    root assets
    index hello.txt
    directory_listing off
    }

    route /uploads {
    methods GET POST DELETE
    root uploads
    index index.html
    directory_listing on
    }

    route /old-page {
    methods GET
    root www
    redirect /about.html
    directory_listing off
    }

    route /cgi {
    methods GET POST
    root cgi
    index hello.py
    cgi .py python3
    directory_listing off
    }

    error_page 400 errors/400.html
    error_page 403 errors/403.html
    error_page 404 errors/404.html
    error_page 405 errors/405.html
    error_page 413 errors/413.html
    error_page 500 errors/500.html
}

server {
    host 127.0.0.1
    port 8080
    server_name second.local
    root www
    index about.html
    max_body_size 1048576

    error_page 400 errors/400.html
    error_page 403 errors/403.html
    error_page 404 errors/404.html
    error_page 405 errors/405.html
    error_page 413 errors/413.html
    error_page 500 errors/500.html
}
